<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap Coin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #111827, #020617);
      color: white;
      min-height: 100vh;
      text-align: center;
    }

    .app {
      max-width: 430px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-top: 20px;
      font-size: 32px;
    }

    .balance {
      margin-top: 25px;
      font-size: 42px;
      font-weight: bold;
    }

    .coin {
      font-size: 20px;
      margin-top: 5px;
      color: #facc15;
    }

    .tap-button {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      margin: 35px auto;
      display: block;
      background: linear-gradient(145deg, #facc15, #eab308);
      box-shadow: 0 10px 35px rgba(234,179,8,.4);
      font-size: 70px;
      cursor: pointer;
      transition: .1s;
    }

    .tap-button:active {
      transform: scale(.92);
    }

    .energy {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .menu button {
      padding: 17px;
      border: none;
      border-radius: 15px;
      background: #1e293b;
      color: white;
      font-size: 16px;
    }

    .menu button:active {
      transform: scale(.96);
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>🪙 Tap Coin</h1>

    <div class="balance" id="balance">0</div>
    <div class="coin">COINS</div>

    <button class="tap-button" onclick="tap()">🪙</button>

    <div class="energy">
      ⚡ Energy: <span id="energy">100</span>/100
    </div>

    <div class="menu">
      <button onclick="missions()">🎯 Missions</button>
      <button onclick="invite()">👥 Invite</button>
      <button onclick="rating()">🏆 Rating</button>
      <button onclick="withdraw()">💸 Withdraw</button>
    </div>

  </div>

  <script>
    let balance = Number(localStorage.getItem("balance")) || 0;
    let energy = Number(localStorage.getItem("energy")) || 100;

    function update() {
      document.getElementById("balance").innerText = balance;
      document.getElementById("energy").innerText = energy;

      localStorage.setItem("balance", balance);
      localStorage.setItem("energy", energy);
    }

    function tap() {
      if (energy <= 0) {
        alert("⚡ Energy тамом шуд!");
        return;
      }

      balance++;
      energy--;

      update();
    }

    function missions() {
      alert("🎯 Missions\n\nМиссияҳо ба зудӣ илова мешаванд.");
    }

    function invite() {
      alert("👥 Invite\n\nСистемаи даъвати дӯст ба зудӣ.");
    }

    function rating() {
      alert("🏆 Rating\n\nРейтинг ба зудӣ илова мешавад.");
    }

    function withdraw() {
      alert("💸 Withdraw\n\nСистемаи гирифтани маблағ ба зудӣ.");
    }

    setInterval(() => {
      if (energy < 100) {
        energy++;
        update();
      }
    }, 3000);

    update();
  </script>

</body>
</html>
